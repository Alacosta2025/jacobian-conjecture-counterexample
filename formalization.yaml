project:
  name: Jacobian Conjecture Counterexample Family
  description: >
    A one-parameter family of polynomial maps F_e : Q^3 -> Q^3 whose Jacobian
    determinant is identically the nonzero constant -e, presented as a
    candidate counterexample family to the Jacobian Conjecture in dimension 3.
    The Lean formalization proves the constant-Jacobian identity by `ring`;
    the non-injectivity claim (F_e_not_injective) is stated but not yet
    closed (contains `sorry`).
  authors:
    - name: Alacosta2025
  license: MIT
  responsible_maintainers:
    - name: Alacosta2025

classification:
  arxiv:
    - math.AC

sources:
  - title: Jacobian conjecture
    url: https://en.wikipedia.org/wiki/Jacobian_conjecture
    relationship: independently-proves

automation:
  methods:
    - method: manual

review:
  status: pending

formalization:
  language: lean4
  mathlib: true
  challenge_file: JacobianCounterexample/Challenge.lean
  solution_file: JacobianCounterexample/Solution.lean
  main_theorems:
    - jacobian_det_family
    - F_e_not_injective
